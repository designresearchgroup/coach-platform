name: Deploy to GitHub Pages

# A static site. A push to main publishes the repo exactly as it sits — no build
# step, so what you commit is what ships. workflow_dispatch re-runs a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the page
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          test -f brand.css  || { echo "::error::brand.css missing — the re-brand layer"; exit 1; }
          test -f img/og.png || { echo "::error::img/og.png missing — link previews would 404"; exit 1; }
          grep -q 'og:image' index.html || { echo "::error::no og:image"; exit 1; }
          grep -q 'rel="canonical"' index.html || { echo "::error::no canonical"; exit 1; }
          grep -q 'brand.css' index.html || { echo "::error::index.html no longer loads brand.css"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
